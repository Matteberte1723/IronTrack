<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IronTrack">
    <link rel="apple-touch-icon" href="/icon-512.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>IronTrack | Il tuo diario di palestra</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" style="height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-color); position: fixed; top: 0; left: 0; z-index: 10000;">
      <h1 style="font-size: 2rem; color: var(--accent-color); animation: pulse 1s infinite;">Caricamento...</h1>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" style="display: none; height: 100vh; width: 100vw; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-color); z-index: 9999; position: fixed; top: 0; left: 0;">
      <h1 style="font-size: 3rem; margin-bottom: 2rem; background: linear-gradient(135deg, var(--accent-color), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">IRONTRACK</h1>
      <p style="color: var(--text-secondary); margin-bottom: 3rem; text-align: center; max-width: 80%;">La tua palestra nel cloud. Accedi per iniziare ad allenarti.</p>
      <button id="btn-login-google" class="btn" style="display: flex; align-items: center; gap: 10px; background: white; color: black; font-weight: bold; padding: 12px 24px; border-radius: 30px;">
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Accedi con Google
      </button>
    </div>

    <!-- Main App Wrapper -->
    <div id="app" style="display: none;">
      <header>
        <h1>IRONTRACK</h1>
        <div id="header-action"></div>
      </header>

      <main id="main-content">
        <!-- Dynamic content injected here -->
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Home
        </a>
        <a href="#" class="nav-item" data-view="routines">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
          </svg>
          Schede
        </a>
        <a href="#" class="nav-item" data-view="history">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Storia
        </a>
        <a href="#" class="nav-item" data-view="progress">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
          </svg>
          Progressi
        </a>
      </nav>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
